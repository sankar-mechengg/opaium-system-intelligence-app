[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opaium"
dynamic = ["version"]
description = "OP(AI)UM — Omniscient Processor for Adaptive Intelligence & Unified Management"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Sankar Balasubramanian"},
]
keywords = ["file-manager", "ai", "windows", "system-intelligence", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/sankar-mechengg/opaium-system-intelligence-app"
Releases = "https://github.com/sankar-mechengg/opaium-system-intelligence-app/releases"
Issues = "https://github.com/sankar-mechengg/opaium-system-intelligence-app/issues"

[project.gui-scripts]
opaium = "src.main:main"

[tool.setuptools.dynamic]
version = {attr = "src.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
# N802: Qt/PySide overrides must match CamelCase API (paintEvent, resizeEvent, …)
# N806: Win32/ctypes code uses UPPER_SNAKE “constants” inside functions (idiomatic)
# E501: Long lines in system prompts and error strings
# SIM102/SIM108: Nested if / ternary preferences hurt readability in UI code
ignore = ["N802", "N806", "E501", "SIM102", "SIM108"]

[tool.ruff.lint.per-file-ignores]
# ctypes Structure names mirror Windows SDK (not CapWords)
"src/utils/windows_api.py" = ["N801"]
"src/ui/native_window.py" = ["N801"]
"src/services/idle_monitor.py" = ["N801"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q"
